<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل الدخول - نجد</title>

  <link
    rel="stylesheet"
    href="assets/css/najd.css"
  >

</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <h1 class="logo">
        نجد
      </h1>

      <p class="subtitle">
        مرحباً بك مجدداً
      </p>

      <form id="loginForm">

        <input
          id="username"
          class="najd-input"
          type="text"
          placeholder="اسم المستخدم"
          required
        >

        <input
          id="password"
          class="najd-input"
          type="password"
          placeholder="كلمة المرور"
          required
        >

        <button
          class="najd-btn"
          type="submit"
        >
          تسجيل الدخول
        </button>

      </form>

      <p class="auth-link">

        ليس لديك حساب؟

        <a href="register.html">
          إنشاء حساب
        </a>

      </p>

    </section>

  </main>

  <script src="assets/js/api.js"></script>

  <script>

    const form =
      document.getElementById(
        "loginForm"
      );

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const button =
          form.querySelector(
            "button"
          );

        button.disabled = true;

        button.textContent =
          "جاري تسجيل الدخول...";

        const result =
          await NajdAPI.login(

            document
              .getElementById(
                "username"
              )
              .value
              .trim(),

            document
              .getElementById(
                "password"
              )
              .value

          );

        if (result.success) {

          localStorage.setItem(
            "najd_token",
            result.token
          );

          localStorage.setItem(
            "najd_user",
            JSON.stringify(
              result.user
            )
          );

          window.location.href =
            "app.html";

        } else {

          alert(
            result.message ||
            "بيانات الدخول غير صحيحة"
          );

          button.disabled =
            false;

          button.textContent =
            "تسجيل الدخول";
        }

      }
    );

  </script>

</body>

</html>
