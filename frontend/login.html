<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل الدخول - نجد</title>

  <link
    rel="stylesheet"
    href="assets/css/najd.css"
  >

</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="brand">

        <h1>نجد</h1>

        <p>
          مرحباً بك مجدداً
        </p>

      </div>

      <form id="loginForm">

        <input
          id="username"
          type="text"
          placeholder="اسم المستخدم"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="كلمة المرور"
          required
        >

        <button type="submit">
          تسجيل الدخول
        </button>

      </form>

      <p class="switch">

        ليس لديك حساب؟

        <a href="register.html">
          إنشاء حساب
        </a>

      </p>

    </section>

  </main>

  <script src="assets/js/api.js"></script>

  <script>

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          const button =
            this.querySelector("button");

          button.disabled = true;

          button.textContent =
            "جارٍ تسجيل الدخول...";

          const result =
            await NajdAPI.login(

              document
                .getElementById("username")
                .value,

              document
                .getElementById("password")
                .value

            );

          if (result.success) {

            localStorage.setItem(
              "najd_token",
              result.token
            );

            localStorage.setItem(
              "najd_user",
              JSON.stringify(result.user)
            );

            window.location.href =
              "app.html";

          } else {

            alert(
              result.message ||
              "بيانات الدخول غير صحيحة"
            );

            button.disabled = false;

            button.textContent =
              "تسجيل الدخول";
          }

        }
      );

  </script>

</body>

</html>
