<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0d0c0a" />
    <title>نجد — تطبيق اللحظات السعودي</title>
    <meta name="description" content="نجد: شارك لحظاتك بالكاميرا والقصص والدردشة والخريطة، بهوية سعودية نجدية." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
:root {
  --sand: #f2c14e;
  --gold: #e2a33c;
  --ink: #0d0c0a;
  --ink-2: #17150f;
  --ink-3: #221e16;
  --line: rgba(242, 193, 78, 0.16);
  --txt: #f6efe2;
  --mut: #a99f8b;
  --palm: #2f6b4f;
  --clay: #b4552d;
  --r: 20px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Tajawal", system-ui, sans-serif;
  background: radial-gradient(120% 90% at 50% 0%, #1b1710 0%, #0a0908 60%);
  color: var(--txt);
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }

.app {
  position: relative;
  width: 100%;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
  background: var(--ink);
}
@media (min-width: 900px) {
  .app { height: min(92dvh, 900px); margin-top: 4dvh; border-radius: 34px; box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1px var(--line); }
}

.safe-top { padding-top: calc(12px + var(--safe-t)); }
.safe-bottom { padding-bottom: calc(12px + var(--safe-b)); }

.screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  padding-bottom: 74px;
  background: var(--ink);
}
.screen.is-active { display: flex; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: scale(.99); } }

/* CAMERA */
.screen--camera { padding-bottom: 74px; }
.cam-stage { position: relative; flex: 1; overflow: hidden; }
.cam-video { width: 100%; height: 100%; object-fit: cover; background: #000; }
.cam-video.mirror { transform: scaleX(-1); }
.cam-shot { display: none; }
.cam-fallback { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #241d12, #0d0c0a); }
.cam-fallback.hide { display: none; }
.dune { position: absolute; inset: auto 0 0 0; height: 46%;
  background: radial-gradient(70% 100% at 30% 100%, var(--gold) 0%, transparent 70%),
              radial-gradient(60% 100% at 80% 100%, var(--clay) 0%, transparent 70%);
  opacity: .35; }
.cam-fallback__txt { position: relative; text-align: center; }
.lens-emoji { font-size: 44px; }
.cam-fallback__txt p { color: var(--mut); margin: 10px 0 14px; }

.cam-top { position: absolute; inset: 0 0 auto 0; display: flex; align-items: center; justify-content: space-between; padding-inline: 14px; gap: 10px; }
.cam-top__mid { display: flex; gap: 8px; }
.round-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.42); backdrop-filter: blur(8px); border: 1px solid var(--line); font-weight: 700; display: grid; place-items: center; }
.pill { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.42); border: 1px solid var(--line); }
.pill.on { background: var(--sand); color: #191307; }

.lens-rail { position: absolute; inset: auto 0 132px 0; display: flex; gap: 10px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; }
.lens-rail::-webkit-scrollbar { display: none; }
.lens { flex: 0 0 auto; min-width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: rgba(13,12,10,.55); border: 1px solid var(--line); backdrop-filter: blur(6px); transition: transform .18s, background .18s; }
.lens.is-active { background: var(--sand); color: #1a1408; transform: scale(1.12); }

.cam-bottom { position: absolute; inset: auto 0 0 0; display: flex; align-items: center; justify-content: space-around; }
.side-btn { width: 48px; height: 48px; border-radius: 16px; background: rgba(0,0,0,.4); border: 1px solid var(--line); font-size: 20px; }
.shutter { width: 82px; height: 82px; border-radius: 50%; border: 5px solid var(--sand); display: grid; place-items: center; transition: transform .12s; }
.shutter span { width: 62px; height: 62px; border-radius: 50%; background: rgba(242,193,78,.18); display: block; }
.shutter:active { transform: scale(.92); }

.preview[hidden] { display: none !important; }
.preview { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; z-index: 5; }
.preview img { flex: 1; width: 100%; object-fit: contain; }
.preview__bar { display: flex; gap: 10px; justify-content: space-between; padding-inline: 16px; }

.btn-ghost { padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 700; }
.btn-solid { padding: 12px 20px; border-radius: 999px; background: var(--sand); color: #1a1408; font-weight: 800; }

/* LISTS */
.list-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.list-top h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.5px; }
.search { padding: 0 16px 10px; }
.search input { width: 100%; padding: 12px 16px; border-radius: 14px; background: var(--ink-3); border: 1px solid var(--line); outline: none; }
.rows, .scroll { flex: 1; overflow-y: auto; margin: 0; padding: 4px 12px 20px; list-style: none; -webkit-overflow-scrolling: touch; }
.row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; }
.row:active { background: var(--ink-3); }
.ava { width: 50px; height: 50px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #1a1408; background: linear-gradient(140deg, var(--sand), var(--clay)); }
.row__t { min-width: 0; }
.row__t b { display: block; font-size: 16px; }
.row__t span { display: block; font-size: 13px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__m { font-size: 12px; color: var(--mut); text-align: center; }
.new { color: var(--sand); font-weight: 800; }

.sec { font-size: 13px; color: var(--mut); margin: 16px 8px 8px; font-weight: 700; }
.mine { padding: 0 4px; }
.story-wide { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--ink-2); border: 1px solid var(--line); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 0 4px; }
.grid--wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile { position: relative; aspect-ratio: 3/4; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); display: flex; align-items: flex-end; padding: 10px; text-align: start; font-weight: 700; font-size: 13px; }
.tile b { position: relative; z-index: 1; }
.tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.75)); }

/* ROOM */
.screen--room { padding-bottom: 0; }
.app.in-room .tabbar { display: none; }
.room-top { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.room-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.room-who .ava { width: 38px; height: 38px; font-size: 14px; }
.room-who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bubbles { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.b { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-break: break-word; }
.b.them { align-self: flex-start; background: var(--ink-3); border-bottom-inline-start-radius: 6px; }
.b.me { align-self: flex-end; background: var(--sand); color: #1a1408; font-weight: 600; border-bottom-inline-end-radius: 6px; }
.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px; background: var(--ink-3); border: 1px solid var(--line); outline: none; }

/* MAP */
.screen--map { padding-bottom: 74px; }
.map-canvas { position: relative; flex: 1; background: radial-gradient(80% 60% at 50% 30%, #2a2214, #100e0a); overflow: hidden; }
.map-grid { position: absolute; inset: -20%; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 46px 46px; transform: rotate(-8deg); }
.map-label { position: absolute; top: calc(16px + var(--safe-t)); inset-inline-start: 16px; background: rgba(0,0,0,.5); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
.pin { position: absolute; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #1a1408; background: linear-gradient(140deg, var(--sand), var(--clay)); box-shadow: 0 8px 20px rgba(0,0,0,.5); animation: bob 3.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.map-sheet { background: var(--ink-2); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 10px 16px; }
.handle { display: block; width: 44px; height: 4px; border-radius: 9px; background: var(--line); margin: 0 auto 10px; }
.map-sheet h2 { font-size: 15px; margin: 0 0 10px; }
.nearby { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.nearby::-webkit-scrollbar { display: none; }
.nearby div { text-align: center; font-size: 11px; color: var(--mut); flex: 0 0 auto; }
.nearby .ava { margin-bottom: 6px; }

/* PROFILE */
.profile .me { text-align: center; padding: 18px 0 8px; }
.me__ava { width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; font-weight: 900; color: #1a1408; background: linear-gradient(140deg, var(--sand), var(--clay)); }
.handle-txt { display: block; color: var(--mut); font-size: 13px; margin-top: 2px; }
.score { display: flex; justify-content: center; gap: 26px; margin-top: 16px; }
.score div { text-align: center; }
.score b { display: block; font-size: 18px; color: var(--sand); }
.score span { font-size: 12px; color: var(--mut); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 20px; padding: 0 4px; }
.card { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 16px; border-radius: 18px; background: var(--ink-2); border: 1px solid var(--line); font-size: 20px; }
.card span { font-size: 14px; font-weight: 700; }

/* TABBAR */
.tabbar { position: absolute; inset: auto 0 0 0; display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(13,12,10,.92); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-top: 8px; z-index: 6; }
.tabbar button { position: relative; display: grid; justify-items: center; gap: 3px; color: var(--mut); font-size: 10px; padding-bottom: 4px; }
.tabbar button i { font-size: 19px; font-style: normal; }
.tabbar button.is-active { color: var(--sand); }
.cam-i { width: 22px; height: 18px; border: 2.4px solid currentColor; border-radius: 6px; position: relative; display: block; }
.cam-i::after { content: ""; position: absolute; inset: 3px; border: 2px solid currentColor; border-radius: 50%; }
.dot { position: absolute; top: 0; inset-inline-end: 22%; width: 8px; height: 8px; border-radius: 50%; background: var(--clay); display: none; }
.dot.on { display: block; }

.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translate(-50%, 20px); background: var(--sand); color: #1a1408; font-weight: 800; padding: 10px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .25s; z-index: 40; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-height: 640px) {
  .shutter { width: 68px; height: 68px; }
  .shutter span { width: 50px; height: 50px; }
  .lens-rail { bottom: 112px; }
}

    </style>
  </head>
  <body>
    <div id="phone" class="app">
      <!-- CAMERA -->
      <section class="screen screen--camera is-active" data-screen="camera">
        <div class="cam-stage">
          <video id="cam" class="cam-video" autoplay playsinline muted></video>
          <canvas id="shot" class="cam-shot" hidden></canvas>
          <div class="cam-fallback" id="camFallback">
            <div class="dune"></div>
            <div class="cam-fallback__txt">
              <span class="lens-emoji">📷</span>
              <p>اضغط لتفعيل الكاميرا</p>
              <button class="btn-ghost" id="enableCam">تفعيل الكاميرا</button>
            </div>
          </div>

          <header class="cam-top safe-top">
            <button class="round-btn" data-goto="profile" aria-label="الملف الشخصي">ن</button>
            <div class="cam-top__mid">
              <button class="pill" id="flashBtn" aria-label="الفلاش">⚡</button>
              <button class="pill" id="flipBtn" aria-label="تبديل الكاميرا">🔄</button>
            </div>
            <button class="round-btn" data-goto="chats" aria-label="بحث">🔍</button>
          </header>

          <div class="lens-rail" id="lensRail" role="tablist" aria-label="العدسات"></div>

          <div class="cam-bottom safe-bottom">
            <button class="side-btn" data-goto="stories" aria-label="القصص">🖼️</button>
            <button class="shutter" id="shutter" aria-label="التقاط"><span></span></button>
            <button class="side-btn" data-goto="map" aria-label="الخريطة">🗺️</button>
          </div>
        </div>

        <div class="preview" id="preview" hidden>
          <img id="previewImg" alt="معاينة اللقطة" />
          <div class="preview__bar safe-bottom">
            <button class="btn-ghost" id="discardShot">إلغاء</button>
            <button class="btn-solid" id="sendShot">إرسال إلى ↗</button>
          </div>
        </div>
      </section>

      <!-- CHATS -->
      <section class="screen screen--list" data-screen="chats">
        <header class="list-top safe-top">
          <h1>الدردشات</h1>
          <button class="round-btn" data-goto="camera" aria-label="كاميرا">📸</button>
        </header>
        <div class="search"><input id="chatSearch" type="search" placeholder="ابحث عن صديق..." /></div>
        <ul class="rows" id="chatList"></ul>
      </section>

      <!-- CHAT ROOM -->
      <section class="screen screen--room" data-screen="room">
        <header class="room-top safe-top">
          <button class="round-btn" data-goto="chats" aria-label="رجوع">›</button>
          <div class="room-who"><span class="ava" id="roomAva"></span><b id="roomName"></b></div>
          <button class="round-btn" aria-label="اتصال">📞</button>
        </header>
        <div class="bubbles" id="bubbles"></div>
        <form class="composer safe-bottom" id="composer">
          <input id="msgInput" placeholder="اكتب رسالة..." autocomplete="off" />
          <button class="btn-solid" type="submit">إرسال</button>
        </form>
      </section>

      <!-- STORIES -->
      <section class="screen screen--list" data-screen="stories">
        <header class="list-top safe-top"><h1>القصص</h1></header>
        <div class="scroll">
          <h2 class="sec">قصتي</h2>
          <div class="mine" id="myStory"></div>
          <h2 class="sec">أصدقاء نجد</h2>
          <div class="grid" id="friendStories"></div>
          <h2 class="sec">اكتشف</h2>
          <div class="grid grid--wide" id="discover"></div>
        </div>
      </section>

      <!-- MAP -->
      <section class="screen screen--map" data-screen="map">
        <div class="map-canvas" id="mapCanvas">
          <div class="map-grid"></div>
          <div class="map-label">الرياض · نجد</div>
        </div>
        <div class="map-sheet safe-bottom">
          <span class="handle"></span>
          <h2>أصدقاء بالقرب منك</h2>
          <div class="nearby" id="nearby"></div>
        </div>
      </section>

      <!-- PROFILE -->
      <section class="screen screen--list" data-screen="profile">
        <header class="list-top safe-top">
          <h1>حسابي</h1>
          <button class="round-btn" data-goto="camera" aria-label="إغلاق">✕</button>
        </header>
        <div class="scroll profile">
          <div class="me">
            <div class="me__ava">ن</div>
            <b>نجد الشمّري</b>
            <span class="handle-txt">najd_sa · نجد</span>
            <div class="score"><div><b id="score">12,480</b><span>النقاط</span></div><div><b>٣٤٢</b><span>أصدقاء</span></div><div><b>٩٨</b><span>قصص</span></div></div>
          </div>
          <div class="cards">
            <button class="card">🏜️<span>ذكرياتي</span></button>
            <button class="card">👥<span>الأصدقاء</span></button>
            <button class="card">✨<span>عدسات نجدية</span></button>
            <button class="card">⚙️<span>الإعدادات</span></button>
          </div>
        </div>
      </section>

      <nav class="tabbar safe-bottom" id="tabbar">
        <button data-goto="map" aria-label="الخريطة"><i>🗺️</i><em>الخريطة</em></button>
        <button data-goto="chats" aria-label="الدردشات"><i>💬</i><em>الدردشة</em><span class="dot" id="chatDot"></span></button>
        <button data-goto="camera" class="is-active" aria-label="الكاميرا"><i class="cam-i"></i><em>الكاميرا</em></button>
        <button data-goto="stories" aria-label="القصص"><i>▶️</i><em>القصص</em></button>
        <button data-goto="profile" aria-label="الحساب"><i>👤</i><em>حسابي</em></button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
/* نجد — Najd app logic (vanilla JS) */
(() => {
  "use strict";

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const toastEl = $("#toast");
  let toastTimer;
  const toast = (m) => {
    toastEl.textContent = m;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 1800);
  };

  /* ---------- data ---------- */
  const FRIENDS = [
    { n: "فيصل العتيبي", h: "faisal", m: "وش رايك نطلع البر؟", t: "٢د", new: true },
    { n: "سارة القحطاني", h: "sarah", m: "أرسلت لقطة 📸", t: "٨د", new: true },
    { n: "عبدالله النجدي", h: "abdullah", m: "الله يعطيك العافية", t: "٢٥د" },
    { n: "منيرة الدوسري", h: "munira", m: "شفتي قصة الدرعية؟", t: "١س" },
    { n: "تركي الشمّري", h: "turki", m: "على حساب القهوة ☕", t: "٣س" },
    { n: "ريم الحربي", h: "reem", m: "بكرة نلتقي بالعليا", t: "أمس" },
    { n: "شباب نجد 🏜️", h: "group", m: "خالد: يالله موعدنا الخميس", t: "أمس" },
  ];
  const LENSES = ["نجدي", "شماغ", "قهوة", "نخل", "رمال", "درعية", "ليل", "كلاسيك"];
  const DISCOVER = [
    ["الدرعية التاريخية", "#7a4a24"],
    ["ليالي الرياض", "#243a5e"],
    ["قهوة نجدية", "#6b4326"],
    ["رمال الثمامة", "#8a6b2a"],
  ];
  const REPLIES = ["هلا والله 👋", "أبشر", "على راسي", "وش صار بعدين؟", "الله يعافيك", "يا هلا بك بنجد 🏜️", "تم، نتواصل"];

  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem("najd:" + k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("najd:" + k, JSON.stringify(v)); } catch {} },
  };
  const threads = store.get("threads", {});

  /* ---------- navigation ---------- */
  const go = (name) => {
    $$(".screen").forEach((s) => s.classList.toggle("is-active", s.dataset.screen === name));
    $$("#tabbar button").forEach((b) => b.classList.toggle("is-active", b.dataset.goto === name));
    document.getElementById("phone").classList.toggle("in-room", name === "room");
    if (name === "camera") startCam();
    if (name === "chats") $("#chatDot").classList.remove("on");
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-goto]");
    if (b) go(b.dataset.goto);
  });

  /* ---------- camera ---------- */
  const video = $("#cam");
  const fallback = $("#camFallback");
  let stream = null;
  let facing = "user";

  async function startCam() {
    if (stream) return;
    if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
      video.srcObject = stream;
      video.classList.toggle("mirror", facing === "user");
      fallback.classList.add("hide");
    } catch {
      stream = null;
    }
  }
  function stopCam() {
    stream?.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  $("#enableCam").addEventListener("click", async () => {
    await startCam();
    if (!stream) toast("الكاميرا غير متاحة هنا");
  });
  $("#flipBtn").addEventListener("click", async () => {
    facing = facing === "user" ? "environment" : "user";
    stopCam();
    await startCam();
    toast(facing === "user" ? "الكاميرا الأمامية" : "الكاميرا الخلفية");
  });
  $("#flashBtn").addEventListener("click", (e) => {
    e.currentTarget.classList.toggle("on");
    toast(e.currentTarget.classList.contains("on") ? "الفلاش مفعّل" : "الفلاش مغلق");
  });

  // lenses
  const rail = $("#lensRail");
  LENSES.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "lens" + (i === 0 ? " is-active" : "");
    b.textContent = l;
    b.addEventListener("click", () => {
      $$(".lens", rail).forEach((x) => x.classList.remove("is-active"));
      b.classList.add("is-active");
      const filters = ["none", "sepia(.4) saturate(1.3)", "contrast(1.2) sepia(.2)", "saturate(1.5)", "sepia(.6)", "grayscale(.4) contrast(1.1)", "brightness(.8) hue-rotate(200deg)", "none"];
      video.style.filter = filters[i] || "none";
      toast("عدسة " + l);
    });
    rail.appendChild(b);
  });

  // shutter
  const canvas = $("#shot");
  $("#shutter").addEventListener("click", () => {
    const w = 720, h = 1280;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    if (stream && video.videoWidth) {
      const vw = video.videoWidth, vh = video.videoHeight;
      const s = Math.max(w / vw, h / vh);
      const dw = vw * s, dh = vh * s;
      ctx.filter = video.style.filter || "none";
      if (facing === "user") { ctx.translate(w, 0); ctx.scale(-1, 1); }
      ctx.drawImage(video, (w - dw) / 2, (h - dh) / 2, dw, dh);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    } else {
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, "#e2a33c"); g.addColorStop(1, "#3a2a14");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    }
    ctx.filter = "none";
    ctx.font = "700 46px Tajawal, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.textAlign = "center";
    ctx.fillText("نجد 🏜️", w / 2, h - 90);
    $("#previewImg").src = canvas.toDataURL("image/jpeg", 0.9);
    $("#preview").hidden = false;
  });
  $("#discardShot").addEventListener("click", () => ($("#preview").hidden = true));
  $("#sendShot").addEventListener("click", () => {
    $("#preview").hidden = true;
    $("#chatDot").classList.add("on");
    toast("تم إرسال اللقطة ✅");
  });

  /* ---------- chats ---------- */
  const initials = (n) => n.trim().charAt(0);
  const chatList = $("#chatList");
  function renderChats(q = "") {
    chatList.innerHTML = "";
    FRIENDS.filter((f) => f.n.includes(q)).forEach((f) => {
      const li = document.createElement("li");
      li.className = "row";
      li.innerHTML = `<span class="ava">${initials(f.n)}</span>
        <span class="row__t"><b>${f.n}</b><span class="${f.new ? "new" : ""}">${f.m}</span></span>
        <span class="row__m">${f.t}</span>`;
      li.addEventListener("click", () => openRoom(f));
      chatList.appendChild(li);
    });
    if (!chatList.children.length) chatList.innerHTML = `<li class="row"><span class="row__t"><b>لا نتائج</b></span></li>`;
  }
  $("#chatSearch").addEventListener("input", (e) => renderChats(e.target.value.trim()));
  renderChats();

  let current = null;
  const bubbles = $("#bubbles");
  function openRoom(f) {
    current = f;
    $("#roomName").textContent = f.n;
    $("#roomAva").textContent = initials(f.n);
    if (!threads[f.h]) threads[f.h] = [{ who: "them", t: f.m }];
    drawBubbles();
    go("room");
  }
  function drawBubbles() {
    bubbles.innerHTML = "";
    threads[current.h].forEach((m) => {
      const d = document.createElement("div");
      d.className = "b " + m.who;
      d.textContent = m.t;
      bubbles.appendChild(d);
    });
    bubbles.scrollTop = bubbles.scrollHeight;
  }
  $("#composer").addEventListener("submit", (e) => {
    e.preventDefault();
    const inp = $("#msgInput");
    const v = inp.value.trim();
    if (!v || !current) return;
    threads[current.h].push({ who: "me", t: v });
    inp.value = "";
    drawBubbles();
    store.set("threads", threads);
    setTimeout(() => {
      threads[current.h].push({ who: "them", t: REPLIES[Math.floor(Math.random() * REPLIES.length)] });
      store.set("threads", threads);
      if ($('.screen--room').classList.contains("is-active")) drawBubbles();
    }, 900);
  });

  /* ---------- stories ---------- */
  $("#myStory").innerHTML = `<div class="story-wide"><span class="ava">ن</span>
    <span class="row__t"><b>أضف إلى قصتي</b><span>شارك لحظتك مع أصدقائك</span></span></div>`;
  $("#myStory").addEventListener("click", () => go("camera"));

  const fs = $("#friendStories");
  FRIENDS.slice(0, 6).forEach((f, i) => {
    const b = document.createElement("button");
    b.className = "tile";
    b.style.background = `linear-gradient(160deg, hsl(${20 + i * 6} ${50 - i * 3}% ${24 + i * 3}%), #14110c)`;
    b.innerHTML = `<b>${f.n}</b>`;
    b.addEventListener("click", () => toast("قصة " + f.n));
    fs.appendChild(b);
  });
  const dc = $("#discover");
  DISCOVER.forEach(([t, c]) => {
    const b = document.createElement("button");
    b.className = "tile";
    b.style.background = `linear-gradient(160deg, ${c}, #100e0a)`;
    b.innerHTML = `<b>${t}</b>`;
    b.addEventListener("click", () => toast(t));
    dc.appendChild(b);
  });

  /* ---------- map ---------- */
  const map = $("#mapCanvas");
  const pos = [[22, 30], [58, 22], [38, 55], [70, 62], [18, 70]];
  FRIENDS.slice(0, 5).forEach((f, i) => {
    const p = document.createElement("button");
    p.className = "pin";
    p.style.insetInlineStart = pos[i][0] + "%";
    p.style.top = pos[i][1] + "%";
    p.style.animationDelay = i * 0.3 + "s";
    p.textContent = initials(f.n);
    p.addEventListener("click", () => toast(f.n + " · بالقرب منك"));
    map.appendChild(p);
  });
  const nb = $("#nearby");
  FRIENDS.slice(0, 6).forEach((f, i) => {
    const d = document.createElement("div");
    d.innerHTML = `<span class="ava">${initials(f.n)}</span>${f.n.split(" ")[0]}<br>${(i + 1) * 2} كم`;
    nb.appendChild(d);
  });

  document.addEventListener("visibilitychange", () => { if (document.hidden) stopCam(); });
  go("camera");
})();

    </script>
  </body>
</html>
