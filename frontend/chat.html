<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نجد - الدردشة</title>
  <link rel="stylesheet" href="assets/css/najd.css">
</head>
<body>
  <div class="najd-container">
    <div class="najd-header">
      <div class="najd-logo">الدردشة الحية</div>
    </div>
    <div id="chatBox" style="flex: 1; overflow-y: auto; padding: 10px 20px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 80px;"></div>
    <div style="position: absolute; bottom: 70px; width: 100%; padding: 0 15px; display: flex; gap: 8px; background: var(--najd-dark);">
      <input type="text" id="msgInput" class="najd-input" placeholder="اكتب رسالتك..." style="margin: 0;">
      <button id="sendBtn" class="najd-btn" style="width: 90px; padding: 10px;">إرسال</button>
    </div>
    <div class="najd-nav-bar">
      <a href="chat.html" class="najd-nav-item active"><span>الدردشة</span></a>
      <a href="app.html" class="najd-nav-item"><span>القصص</span></a>
    </div>
  </div>
  <script src="assets/js/chat.js"></script>
</body>
</html>
