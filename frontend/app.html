<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نجد - Najd</title>
  <link rel="stylesheet" href="assets/css/najd.css">
</head>
<body>
  <div class="najd-container">
    <!-- Header -->
    <div class="najd-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <img id="userAvatar" src="" alt="Profile" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--najd-yellow);">
        <span id="userName" style="font-weight: bold; font-size: 15px;"></span>
      </div>
      <div class="najd-logo">نجد</div>
    </div>

    <!-- Main Viewport -->
    <div id="viewport" style="flex: 1; overflow-y: auto; padding: 10px 20px; padding-bottom: 80px;">
      <h2 style="font-size: 18px; margin-bottom: 15px;">قصص الأصدقاء</h2>
      <div id="storiesContainer" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- Stories dynamically injected here -->
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="najd-nav-bar">
      <a href="chat.html" class="najd-nav-item">
        <span>الدردشة</span>
      </a>
      <a href="app.html" class="najd-nav-item active">
        <span>الكاميرا</span>
      </a>
      <a href="explore.html" class="najd-nav-item">
        <span>الاستكشاف</span>
      </a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
