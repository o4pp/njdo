<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>نجد - الرئيسية</title>

  <link
    rel="stylesheet"
    href="assets/css/najd.css"
  >

</head>

<body>

  <header class="topbar">

    <h1>
      نجد
    </h1>

    <div>

      <span id="userName">
        المستخدم
      </span>

      <button
        id="logoutButton"
        class="small-button"
      >
        خروج
      </button>

    </div>

  </header>

  <main class="app">

    <section class="welcome-card">

      <h2>
        أهلاً بك في نجد 👋
      </h2>

      <p>
        هذه الصفحة الرئيسية لمنصة نجد.
      </p>

    </section>

    <section class="stories-section">

      <h2>
        القصص
      </h2>

      <div id="stories">
        جارٍ تحميل القصص...
      </div>

    </section>

  </main>

  <script src="assets/js/api.js"></script>

  <script>

    async function loadUser() {

      const result =
        await NajdAPI.me();

      if (!result.success) {

        localStorage.clear();

        window.location.href =
          "login.html";

        return;
      }

      document
        .getElementById("userName")
        .textContent =
        result.user.display_name;

    }

    async function loadStories() {

      const result =
        await NajdAPI.getStories();

      const container =
        document.getElementById("stories");

      if (!result.success) {

        container.textContent =
          "تعذر تحميل القصص";

        return;
      }

      if (
        !result.stories ||
        result.stories.length === 0
      ) {

        container.textContent =
          "لا توجد قصص حالياً";

        return;
      }

      container.innerHTML =
        result.stories
          .map(story => `

            <article class="story-card">

              <img
                src="${story.media_url}"
                alt=""
              >

              <h3>
                ${story.display_name}
              </h3>

              <p>
                ${story.caption || ""}
              </p>

            </article>

          `)
          .join("");

    }

    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        async function() {

          await NajdAPI.logout();

          localStorage.clear();

          window.location.href =
            "login.html";

        }
      );

    loadUser();

    loadStories();

  </script>

</body>

</html>
