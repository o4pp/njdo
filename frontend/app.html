<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نجد - القصص</title>
  <link rel="stylesheet" href="assets/css/najd.css">
</head>
<body>
  <div class="snap-container">
    <!-- Header -->
    <div class="snap-header">
      <div class="snap-profile-badge">
        <img id="userAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100">
      </div>
      <div style="font-weight: 900; font-size: 20px; color: var(--snap-yellow); letter-spacing: -0.5px;">نجد</div>
      <div class="snap-header-actions">
        <button class="snap-icon-btn" id="addStoryBtn">+</button>
      </div>
    </div>
    
    <!-- Main View -->
    <div class="snap-main-view">
      <div style="font-size: 22px; font-weight: 900; margin-bottom: 4px;">القصص</div>
      <div id="storiesContainer" style="display: flex; flex-direction: column; gap: 14px;"></div>
    </div>

    <!-- Snapchat 5-Tab Bottom Bar -->
    <div class="snap-nav-bar">
      <a href="map.html" class="snap-nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        <span>الخريطة</span>
      </a>
      <a href="chat.html" class="snap-nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <span>الدردشة</span>
      </a>
      <a href="camera.html" class="snap-nav-item active">
        <div class="snap-camera-btn">
          <svg viewBox="0 0 24 24" style="width: 22px; height: 22px; fill: #000;"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0-5c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        </div>
      </a>
      <a href="app.html" class="snap-nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        <span>القصص</span>
      </a>
      <a href="spotlight.html" class="snap-nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>الأضواء</span>
      </a>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("najd_token");
      if (!token) { window.location.href = "login.html"; return; }

      const user = JSON.parse(localStorage.getItem("najd_user") || "{}");
      if (user.avatar_url) document.getElementById("userAvatar").src = user.avatar_url;

      const container = document.getElementById("storiesContainer");
      const res = await NajdAPI.getStories();

      if (res.success && res.stories.length > 0) {
        container.innerHTML = res.stories.map(s => `
          <div class="snap-card-box">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
              <img src="${s.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'}" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--snap-yellow);">
              <span style="font-weight: bold; font-size: 14px;">${s.display_name}</span>
            </div>
            ${s.media_url ? `<img src="${s.media_url}" style="width: 100%; max-height: 340px; object-fit: cover; border-radius: 14px;">` : ''}
            ${s.caption ? `<p style="margin-top: 10px; font-size: 14px; color: #ddd;">${s.caption}</p>` : ''}
          </div>
        `).join('');
      } else {
        container.innerHTML = `<p style="text-align: center; color: var(--snap-gray); margin-top: 60px;">لا توجد قصص نشطة حالياً</p>`;
      }

      document.getElementById("addStoryBtn").addEventListener("click", async () => {
        const caption = prompt("اكتب وصف القصة:");
        if (caption !== null) {
          const res = await NajdAPI.postStory("", "image", caption);
          if (res.success) window.location.reload();
        }
      });
    });
  </script>
</body>
</html>
