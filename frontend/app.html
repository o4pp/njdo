<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>نجد - الرئيسية</title>

  <link
    rel="stylesheet"
    href="assets/css/najd.css"
  >

</head>

<body>

  <header class="topbar">

    <h1 class="logo">
      نجد
    </h1>

    <button
      id="logoutBtn"
      class="logout-btn"
    >
      تسجيل الخروج
    </button>

  </header>

  <main class="app-container">

    <section class="welcome-card">

      <h2 id="welcome">
        مرحباً بك
      </h2>

      <p>
        أهلاً بك في منصة نجد
      </p>

    </section>

    <section class="stories-section">

      <h2>
        القصص
      </h2>

      <div
        id="stories"
        class="stories"
      >
        جاري تحميل القصص...
      </div>

    </section>

  </main>

  <script src="assets/js/api.js"></script>

  <script>

    const token =
      localStorage.getItem(
        "najd_token"
      );

    if (!token) {

      window.location.href =
        "login.html";

    }

    const user =
      JSON.parse(
        localStorage.getItem(
          "najd_user"
        ) || "{}"
      );

    document
      .getElementById(
        "welcome"
      )
      .textContent =
      `مرحباً ${user.display_name || user.username || ""}`;

    document
      .getElementById(
        "logoutBtn"
      )
      .addEventListener(
        "click",
        async () => {

          await NajdAPI.logout();

          localStorage.removeItem(
            "najd_token"
          );

          localStorage.removeItem(
            "najd_user"
          );

          window.location.href =
            "login.html";

        }
      );

    async function loadStories() {

      const container =
        document.getElementById(
          "stories"
        );

      const result =
        await NajdAPI.getStories();

      if (
        !result.success
      ) {

        container.textContent =
          result.message ||
          "تعذر تحميل القصص";

        return;
      }

      if (
        !result.stories ||
        result.stories.length === 0
      ) {

        container.textContent =
          "لا توجد قصص حالياً";

        return;
      }

      container.innerHTML =
        result.stories
          .map(
            (story) => `

              <article class="story-card">

                ${
                  story.media_type ===
                  "video"

                    ? `
                      <video
                        src="${story.media_url}"
                        controls
                      ></video>
                    `

                    : `
                      <img
                        src="${story.media_url}"
                        alt="قصة"
                      >
                    `
                }

                <div class="story-info">

                  <strong>
                    ${
                      story.display_name ||
                      story.username
                    }
                  </strong>

                  <p>
                    ${
                      story.caption || ""
                    }
                  </p>

                </div>

              </article>

            `
          )
          .join("");

    }

    loadStories();

  </script>

</body>

</html>
