<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب - نجد</title>

  <link rel="stylesheet" href="assets/css/najd.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="brand">
        <h1>نجد</h1>
        <p>أنشئ حسابك الجديد</p>
      </div>

      <form id="registerForm">

        <input
          id="display_name"
          type="text"
          placeholder="الاسم الكامل"
          required
        >

        <input
          id="username"
          type="text"
          placeholder="اسم المستخدم"
          minlength="3"
          required
        >

        <input
          id="email"
          type="email"
          placeholder="البريد الإلكتروني اختياري"
        >

        <input
          id="password"
          type="password"
          placeholder="كلمة المرور"
          minlength="6"
          required
        >

        <button type="submit">
          إنشاء الحساب
        </button>

      </form>

      <p class="switch">
        لديك حساب بالفعل؟
        <a href="login.html">
          تسجيل الدخول
        </a>
      </p>

    </section>

  </main>

  <script src="assets/js/api.js"></script>

  <script>

    const form =
      document.getElementById("registerForm");

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const button =
          form.querySelector("button");

        button.disabled = true;

        button.textContent =
          "جارٍ إنشاء الحساب...";

        const result =
          await NajdAPI.register(

            document
              .getElementById("username")
              .value,

            document
              .getElementById("password")
              .value,

            document
              .getElementById("display_name")
              .value,

            document
              .getElementById("email")
              .value || null

          );

        if (result.success) {

          alert(
            "تم إنشاء الحساب بنجاح"
          );

          window.location.href =
            "login.html";

        } else {

          alert(
            result.message ||
            "فشل إنشاء الحساب"
          );

          button.disabled = false;

          button.textContent =
            "إنشاء الحساب";
        }

      }

    );

  </script>

</body>

</html>
