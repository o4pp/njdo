<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب جديد - نجد</title>
  <link rel="stylesheet" href="assets/css/najd.css">
</head>
<body>
  <div class="najd-container" style="justify-content: center; padding: 30px;">
    <div style="text-align: center; margin-bottom: 40px;">
      <h1 class="najd-logo" style="font-size: 40px;">نجد</h1>
      <p style="color: var(--najd-gray); margin-top: 8px;">أنشئ حسابك الجديد</p>
    </div>

    <form id="registerForm">
      <input type="text" id="display_name" class="najd-input" placeholder="الاسم الكامل" required>
      <input type="text" id="username" class="najd-input" placeholder="اسم المستخدم" required>
      <input type="password" id="password" class="najd-input" placeholder="كلمة المرور" required>
      <button type="submit" class="najd-btn" style="margin-top: 10px;">إنشاء الحساب</button>
    </form>

    <p style="text-align: center; margin-top: 20px; color: var(--najd-gray); font-size: 14px;">
      لديك حساب بالفعل؟ <a href="login.html" style="color: var(--najd-yellow); text-decoration: none;">تسجيل الدخول</a>
    </p>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const display_name = document.getElementById("display_name").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await NajdAPI.register(username, password, display_name);
      if (res.success) {
        alert("تم إنشاء الحساب بنجاح، يرجى تسجيل الدخول.");
        window.location.href = "login.html";
      } else {
        alert(res.error || "فشل إنشاء الحساب");
      }
    });
  </script>
</body>
</html>
